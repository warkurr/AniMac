name: Bug report
description: Report a bug, crash, or unexpected behavior in AniMac
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: AniMac version
      placeholder: "e.g., 0.3.0"
    validations:
      required: false

  - type: input
    id: macos_version
    attributes:
      label: macOS version and architecture
      placeholder: "e.g., macOS 15.1, Apple Silicon (M2) or Intel (x86_64)"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Error messages, console logs, or crash traces.
    validations:
      required: false
